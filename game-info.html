<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ice Bite — Sticky Play Demo</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080420;color:#fff;font-family:Arial,sans-serif;padding-bottom:100px}
.page{position:relative;max-width:1024px;margin:auto}.design{display:block;width:100%;height:auto}
.original{position:absolute;left:4.68%;top:13.12%;width:13.3%;height:1.58%;border:0;border-radius:99px;background:transparent;cursor:pointer}.original{overflow:hidden;isolation:isolate;transition:transform 180ms cubic-bezier(.22,1,.36,1);background:linear-gradient(120deg,#5720ab,#872eff);border:1px solid #b47aff;color:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font:600 clamp(8px,1.35vw,14px) Arial,sans-serif;box-shadow:0 0 10px #923dff44;}
.original .play{display:grid;place-items:center;width:1.4em;height:1.4em;background:#fff;color:#6929bc;border-radius:50%;font-size:.75em;}
.original::after{content:"";position:absolute;inset:-60% auto -60% 0;width:24%;background:linear-gradient(90deg,transparent,#ffffff66,transparent);transform:translateX(-240%) skewX(-20deg);pointer-events:none;animation:shine 6s ease-in-out infinite;animation-delay:.45s;animation-play-state:var(--shine-state,running);}
@media(hover:hover){.original:hover{transform:scale(1.04)}.original:hover::after{animation-play-state:paused}}
.original:active{transform:scale(.98)}
.original:focus-visible{transform:scale(1.04);outline:3px solid #d6b5ff;outline-offset:4px}
.dock{position:fixed;right:max(24px,calc((100vw - 1024px)/2 + 24px));bottom:24px;z-index:100;display:flex;align-items:center;gap:24px;padding:12px 14px 12px 20px;border:1px solid #9a61e855;border-radius:22px;background:#140a2eef;box-shadow:0 12px 40px #0006;backdrop-filter:blur(16px);opacity:0;transform:translateY(16px);visibility:hidden;transition:opacity 220ms ease,transform 220ms cubic-bezier(.22,1,.36,1),visibility 220ms;}
.dock.visible{opacity:1;transform:translateY(0);visibility:visible}.identity strong{display:block;font-size:16px}.identity span{display:block;color:#bba8d3;font-size:12px;margin-top:5px}
.demo{position:relative;isolation:isolate;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:9px;min-height:48px;padding:0 28px;background:linear-gradient(120deg,#5720ab,#872eff);border:1px solid #b47aff;border-radius:99px;color:#fff;font:600 15px Arial,sans-serif;box-shadow:0 0 12px #923dff44;cursor:pointer;transition:transform 180ms cubic-bezier(.22,1,.36,1),box-shadow 180ms ease}
.demo .play{display:grid;place-items:center;background:white;color:#6929bc;border-radius:50%;width:21px;height:21px;font-size:10px;padding-left:1px}
.demo::after{content:"";position:absolute;inset:-60% auto -60% 0;width:24%;background:linear-gradient(90deg,transparent,#ffffff66,transparent);transform:translateX(-240%) skewX(-20deg);pointer-events:none;}
.dock.visible .demo::after{animation:shine 6s ease-in-out infinite;animation-delay:.45s;animation-play-state:var(--shine-state,running);}
@keyframes shine{0%{transform:translateX(-240%) skewX(-20deg)}14%,100%{transform:translateX(650%) skewX(-20deg)}}
@media(hover:hover){.demo:hover{transform:scale(1.04);box-shadow:0 0 16px #a05aff77}.demo:hover::after{animation-play-state:paused}}
.demo:active{transform:scale(.98)}.demo:focus-visible,.close:focus-visible{outline:3px solid #e3caff;outline-offset:4px}
dialog{background:#160c2c;color:white;border:1px solid #8f57ce;border-radius:24px;padding:28px;width:min(420px,calc(100% - 32px));box-shadow:0 20px 100px #000a}dialog::backdrop{background:#030014bb}dialog h2{margin-top:0}dialog p{color:#cbbddc;line-height:1.6}.close{background:#7830d9;color:white;border:1px solid #b37aff;border-radius:25px;padding:12px 22px;font:inherit;cursor:pointer}
@media(max-width:600px){.dock{left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));gap:12px;justify-content:space-between;padding:10px 12px 10px 16px;border-radius:20px}.demo{padding:0 22px}.identity strong{font-size:14px}.identity span{font-size:11px}.original{min-height:20px}}
@media(prefers-reduced-motion:reduce){.dock,.demo,.original{transition:none;transform:none!important}.demo::after,.original::after{animation:none!important;display:none}}
</style>
